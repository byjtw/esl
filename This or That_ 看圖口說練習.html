<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>This or That? 看圖口說練習</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff8ee;--ink:#2b2a33;--card:#fff;--this:#3f7fd1;--this-bg:#d3e9f8;--that:#c4608f;--that-bg:#f4d5cd;--ok:#4f9a3f;--gold:#ecc155;--mute:#6b6877;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#201d2a;--ink:#f6f2ea;--card:#2d2a3a;--this:#7db2f2;--that:#ec9cc2;--mute:#b3afc2}}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Fredoka','Noto Sans TC','PingFang TC',system-ui,sans-serif;line-height:1.5}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:1.5rem;margin:4px 0 2px}
.sub{color:var(--mute);margin:0 0 12px;font-size:.95rem}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px;font-weight:500}
.prog{flex:1;height:10px;background:color-mix(in srgb,var(--ink) 12%,transparent);border-radius:9px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--gold);transition:width .3s}
.rule{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.rule div{border-radius:14px;padding:8px 10px;font-size:.9rem;color:#2b2a33}
.rule .a{background:var(--this-bg)}.rule .b{background:var(--that-bg)}
.rule b{font-size:1.05rem}
.stage{background:var(--card);border-radius:22px;padding:12px;box-shadow:0 2px 0 color-mix(in srgb,var(--ink) 14%,transparent)}
.pic{border-radius:16px;overflow:hidden;aspect-ratio:1/1;max-height:340px;margin:0 auto;display:flex;background:#eee}
.pic img{width:100%;height:100%;object-fit:contain;background:#fff}
.q{font-size:1.25rem;text-align:center;margin:12px 0 8px;font-weight:700}
.row{display:flex;gap:10px}
button{font:inherit;font-weight:700;border:0;border-radius:16px;padding:14px 12px;cursor:pointer;color:#fff;flex:1;font-size:1.15rem;min-height:56px}
button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.bthis{background:var(--this)}.bthat{background:var(--that)}
.bgo{background:var(--ok)}.bgh{background:transparent;color:var(--ink);border:2px solid color-mix(in srgb,var(--ink) 30%,transparent)}
button:disabled{opacity:.45;cursor:default}
.msg{min-height:1.6em;text-align:center;font-size:1.05rem;margin:8px 0}
.good{color:var(--ok);font-weight:700}.bad{color:var(--that);font-weight:700}
.say{border:3px dashed var(--gold);border-radius:16px;padding:10px;text-align:center;margin:8px 0}
.ans{font-size:1.5rem;font-weight:700;line-height:1.4}
.ans span{display:block}
.hide{display:none}
.end{text-align:center;padding:20px 8px}
.end .big{font-size:2.2rem}
.num{display:inline-block;background:var(--gold);color:#2b2a33;border-radius:50%;width:2em;height:2em;line-height:2em;text-align:center;font-weight:700}
</style>
</head>
<body>
<main>
<h1>This or That? 看圖口說練習</h1>
<p class="sub">看圖、判斷遠近、大聲說出句子!</p>

<div class="b"><b>that</b> 那個<br>遠:手指指向遠處</div>

const $=id=>document.getElementById(id);
let deck,i,score,tries;
function shuffle(a){a=a.slice();for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]]}return a}
function art(o){return /^[aeiou]/.test(o)?'an':'a'}
function speak(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.85;speechSynthesis.speak(u)}catch(e){}}
function start(){deck=shuffle(CARDS);i=0;score=0;show()}
function show(){
  tries=0;
  if(i>=deck.length){
    $('stage').innerHTML=`<div class="end"><div class="big">🎉</div><h2>完成了!</h2><p>第一次就答對:${score} / ${deck.length}</p><button class="bgo" id="again">再玩一次</button></div>`;
    $('again').onclick=start;$('pg').style.width='100%';return}
  const c=deck[i];
  $('cnt').textContent=(i+1)+' / '+deck.length;
  $('pg').style.width=(i/deck.length*100)+'%';
  $('score').textContent='⭐ '+score;
  $('stage').innerHTML=`
   <div class="pic"><img src="${c.img}" alt="練習圖卡 ${c.n}"></div>
   <div class="q">1. 是 this 還是 that?</div>
   <div class="row"><button class="bthis" data-a="this">this 近</button><button class="bthat" data-a="that">that 遠</button></div>
   <div class="msg" id="msg"></div>
   <div id="step2" class="hide">
     <div class="q">2. 大聲說出來!</div>
     <div class="say">What's ___?<br>It's ___ ___.</div>
     <div class="row"><button class="bgh" id="reveal">看答案 👀</button></div>
     <div id="ans" class="hide">
       <div class="say ans"><span>What's ${c.t}?</span><span>It's ${art(c.obj)} ${c.obj}.</span></div>
       <div class="row"><button class="bgh" id="play">🔊 聽一聽</button><button class="bgo" id="next">下一張 ➜</button></div>
     </div>
   </div>`;
  document.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>pick(b.dataset.a,c));
}
function pick(a,c){
  const m=$('msg');
  if(a===c.t){
    if(tries===0)score++;
    $('score').textContent='⭐ '+score;
    m.innerHTML='<span class="good">答對了!這是 '+c.t+' ✓</span>';
    document.querySelectorAll('[data-a]').forEach(b=>b.disabled=true);
    $('step2').classList.remove('hide');
    $('reveal').onclick=()=>{$('ans').classList.remove('hide');$('reveal').classList.add('hide');speak("What's "+c.t+"? It's "+art(c.obj)+" "+c.obj+".")};

  }else{
    tries++;
    m.innerHTML='<span class="bad">再看看:手指離東西近還是遠?</span>';
  }
}
$('stage').addEventListener('click',e=>{
  const c=deck[i]; if(!c)return;
  if(e.target.id==='play')speak("What's "+c.t+"? It's "+art(c.obj)+" "+c.obj+".");
  if(e.target.id==='next'){i++;show()}
});
document.addEventListener('keydown',e=>{if(e.key==='r'||e.key==='R')start()});
start();
</script>
</body>
</html>
